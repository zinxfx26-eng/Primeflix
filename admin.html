<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeFlix Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>🎬 PrimeFlix Admin Panel</h1>

<div class="container">

    <h2>Add Movie</h2>

    <input type="text" id="movieTitle" placeholder="Movie Title">

    <input type="text" id="moviePoster" placeholder="Poster Image URL">

    <textarea id="movieDesc" placeholder="Movie Description"></textarea>

    <button id="addMovie">Add Movie</button>

    <hr>

    <h2>Add News</h2>

    <input type="text" id="newsTitle" placeholder="News Title">

    <textarea id="newsContent" placeholder="News Content"></textarea>

    <button id="addNews">Add News</button>

</div>

<script src="admin.js"></script>

</body>
</html>
