<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeFlix Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>🎬 PrimeFlix Admin Panel</h1>

<div class="container">
<h2>🎬 Add Movie</h2>

<input type="text" id="movieTitle" placeholder="Movie Title">

<input type="text" id="posterUrl" placeholder="Poster Image URL (Google Drive)">

<input type="text" id="movieUrl" placeholder="Movie URL (Google Drive)">

<textarea id="description" placeholder="Movie Description"></textarea>

<input type="text" id="category" placeholder="Category (Action, Horror, Comedy...)">

<input type="number" id="year" placeholder="Release Year">

<input type="number" step="0.1" id="rating" placeholder="IMDb Rating">

<button id="addMovie">➕ Add Movie</button>
    <hr>

<h2>🎬 Manage Movies</h2>

<div id="movieList"></div>
    <hr>

    <h2>Add News</h2>

    <input type="text" id="newsTitle" placeholder="News Title">

    <textarea id="newsContent" placeholder="News Content"></textarea>

    <button id="addNews">Add News</button>

</div>

<script src="admin.js"></script>

</body>
</html>
